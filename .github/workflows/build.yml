name: CI & Release Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build Universal GMS Release
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Release,O=anotherMusic,C=US"

      - name: Build Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-gms-release
          path: app/build/outputs/apk/universalGms/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.repository == 'jinkun1998/another.Music' && (github.ref == 'refs/heads/android/upstream-foldable' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/universalGms/release/*.apk | head -n 1)
          TAG="v8.3.2-foldable"
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "anotherMusic Android v8.3.2 (Foldable + Upstream)" \
            --notes "Release APK for Android (Universal GMS):
          - Upstream sync: includes all latest Mochy-Music features (Bluetooth auto-resume, search history toggle, custom folder storage, radio continuity).
          - Foldable/Tablet optimizations: bounded covers, adaptive 2-column search, clamped controls.
          - Full release optimizations (R8 minification, resource shrinking)." \
            --repo "$GITHUB_REPOSITORY" \
            --latest
